name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Resolve UI base URL
        shell: bash
        env:
          BASE_URL_SECRET: ${{ secrets.BASE_URL }}
          LEGACY_BASE_URL_SECRET: ${{ secrets.BASEURL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          base_url="${BASE_URL_SECRET:-${LEGACY_BASE_URL_SECRET:-}}"

          if [[ -z "$base_url" && -n "$API_BASE_URL" ]]; then
            api_base_url="${API_BASE_URL%/}"
            if [[ "$api_base_url" == */api ]]; then
              base_url="${api_base_url%/api}"
            fi
          fi

          if [[ -z "$base_url" ]]; then
            echo "::error::Set the BASE_URL GitHub Actions secret (or API_BASE_URL ending in /api)."
            exit 1
          fi

          if [[ ! "$base_url" =~ ^https?:// ]]; then
            echo "::error::BASE_URL must start with http:// or https://."
            exit 1
          fi

          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
      - name: Run Playwright tests
        run: npx playwright test
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ORG_ADMIN_EMAIL: ${{ secrets.ORG_ADMIN_EMAIL }}
          ORG_ADMIN_PASSWORD: ${{ secrets.ORG_ADMIN_PASSWORD }}
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30